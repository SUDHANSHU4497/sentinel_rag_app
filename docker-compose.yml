# Local MongoDB, Neo4j and Qdrant for the fraud-explain API (instead of Atlas, Aura and Qdrant Cloud).
# docker compose up -d
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  neo4j:
    image: neo4j:5.26-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/sentinel123
      NEO4J_server_memory_heap_max__size: 2G
    volumes: [neo4j_data:/data]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
volumes:
  mongo_data:
  neo4j_data:
  qdrant_data:
