<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t{font-size:15px;fill:#0f172a}
      .s{font-size:13px;fill:#334155}
      .h{font-size:17px;font-weight:700;fill:#0f172a}
      .lbl{font-size:12px;fill:#475569}
      .why{font-size:12.5px;fill:#1e293b}
      .step{fill:#ffffff;stroke:#64748b;stroke-width:1.3;rx:8}
      .line{stroke:#334155;stroke-width:1.6;fill:none}
      .dash{stroke:#94a3b8;stroke-width:1.4;fill:none;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1500" height="980" fill="#ffffff"/>
  <text x="40" y="44" style="font-size:24px;font-weight:700;fill:#0f172a">SENTINEL fraud-explain API: which database stores what, and why</text>
  <text x="40" y="70" class="s">POST /explain {transaction_id}  →  risk summary, reason codes that fired, recommended action, cited policy chunks</text>

  <!-- Investigator -->
  <rect x="40" y="120" width="150" height="70" rx="35" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="115" y="150" text-anchor="middle" class="t" font-weight="600">Investigator</text>
  <text x="115" y="170" text-anchor="middle" class="lbl">transaction_id</text>
  <line x1="190" y1="155" x2="228" y2="155" class="line" marker-end="url(#a)"/>

  <!-- API box -->
  <rect x="230" y="96" width="1040" height="128" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="246" y="118" class="h">FastAPI service  (api.py)</text>
  <g>
    <rect x="248" y="130" width="148" height="78" class="step"/>
    <text x="322" y="158" text-anchor="middle" class="t">1  payment +</text>
    <text x="322" y="178" text-anchor="middle" class="t">feature snapshot</text>
    <rect x="417" y="130" width="148" height="78" class="step"/>
    <text x="491" y="158" text-anchor="middle" class="t">2  device and</text>
    <text x="491" y="178" text-anchor="middle" class="t">customer graph</text>
    <rect x="586" y="130" width="148" height="78" class="step"/>
    <text x="660" y="158" text-anchor="middle" class="t">3  hard rules +</text>
    <text x="660" y="178" text-anchor="middle" class="t">cutoffs 0.6 / 0.85</text>
    <rect x="755" y="130" width="148" height="78" class="step"/>
    <text x="829" y="158" text-anchor="middle" class="t">4  policy search</text>
    <text x="829" y="178" text-anchor="middle" class="t">one per signal</text>
    <rect x="924" y="130" width="148" height="78" class="step"/>
    <text x="998" y="158" text-anchor="middle" class="t">5  LLM writes</text>
    <text x="998" y="178" text-anchor="middle" class="t">JSON answer</text>
    <rect x="1093" y="130" width="160" height="78" class="step"/>
    <text x="1173" y="152" text-anchor="middle" class="t">6  guardrails</text>
    <text x="1173" y="171" text-anchor="middle" class="lbl">only fired codes, only</text>
    <text x="1173" y="187" text-anchor="middle" class="lbl">retrieved chunks, policy</text>
    <text x="1173" y="203" text-anchor="middle" class="lbl">action is the floor</text>
    <line x1="396" y1="169" x2="415" y2="169" class="line" marker-end="url(#a)"/>
    <line x1="565" y1="169" x2="584" y2="169" class="line" marker-end="url(#a)"/>
    <line x1="734" y1="169" x2="753" y2="169" class="line" marker-end="url(#a)"/>
    <line x1="903" y1="169" x2="922" y2="169" class="line" marker-end="url(#a)"/>
    <line x1="1072" y1="169" x2="1091" y2="169" class="line" marker-end="url(#a)"/>
  </g>

  <!-- output -->
  <line x1="1270" y1="160" x2="1298" y2="160" class="line" marker-end="url(#a)"/>
  <rect x="1300" y="104" width="170" height="112" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1385" y="128" text-anchor="middle" class="t" font-weight="600">JSON response</text>
  <text x="1385" y="150" text-anchor="middle" class="s">risk_summary</text>
  <text x="1385" y="167" text-anchor="middle" class="s">reason_codes</text>
  <text x="1385" y="184" text-anchor="middle" class="s">recommended_action</text>
  <text x="1385" y="201" text-anchor="middle" class="s">cited_sources</text>

  <!-- connectors to stores -->
  <line x1="322" y1="208" x2="322" y2="318" class="line" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="330" y="262" class="lbl">find_one(_id)</text>
  <line x1="640" y1="208" x2="330" y2="318" class="dash" marker-start="url(#g)"/>
  <text x="345" y="300" class="lbl">block / allow lists, cutoffs</text>
  <line x1="491" y1="208" x2="700" y2="318" class="line" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="600" y="246" class="lbl">4 Cypher queries</text>
  <line x1="829" y1="208" x2="1060" y2="318" class="line" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="950" y="252" class="lbl">top 3 per signal</text>
  <path d="M880,208 V284 H1380 V700" class="dash" marker-end="url(#g)"/>
  <path d="M1040,208 V284" class="dash"/>
  <text x="1200" y="278" class="lbl">embedding + LLM calls</text>

  <!-- MongoDB -->
  <g>
    <path d="M60,340 a142,20 0 0,0 284,0 v270 a142,20 0 0,1 -284,0 z" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="202" cy="340" rx="142" ry="20" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="202" y="345" text-anchor="middle" class="h">MongoDB  (task 1)</text>
    <text x="202" y="378" text-anchor="middle" class="s">or Supabase (same tables, REST)</text>
    <text x="80" y="408" class="t" font-weight="600">Stores</text>
    <text x="80" y="428" class="why">• transactions: payment with merchant,</text>
    <text x="80" y="445" class="why">   device, features, reason codes, score</text>
    <text x="80" y="462" class="why">   embedded (144,803 validation rows)</text>
    <text x="80" y="479" class="why">• customers (devices embedded)</text>
    <text x="80" y="496" class="why">• hard_rules, list_entries, thresholds</text>
    <text x="80" y="526" class="t" font-weight="600">Why</text>
    <text x="80" y="546" class="why">One key lookup returns everything about</text>
    <text x="80" y="563" class="why">the payment (~2 ms). The snapshot is</text>
    <text x="80" y="580" class="why">written once and always read with it,</text>
    <text x="80" y="597" class="why">so embedding saves a join.</text>
  </g>

  <!-- Neo4j -->
  <g>
    <path d="M560,340 a142,20 0 0,0 284,0 v270 a142,20 0 0,1 -284,0 z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="702" cy="340" rx="142" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="702" y="345" text-anchor="middle" class="h">Neo4j  (task 2)</text>
    <text x="702" y="378" text-anchor="middle" class="s">364,070 payments, Aug to Dec 2025</text>
    <text x="580" y="408" class="t" font-weight="600">Stores</text>
    <text x="580" y="428" class="why">• (Customer)-[USED_DEVICE]-&gt;(Device)</text>
    <text x="580" y="445" class="why">• (Customer)-[PAID {amount, time,</text>
    <text x="580" y="462" class="why">   fraud_label, label_available_at,</text>
    <text x="580" y="479" class="why">   device_id}]-&gt;(Merchant)</text>
    <text x="580" y="509" class="t" font-weight="600">Why</text>
    <text x="580" y="529" class="why">"Who else used this device in the last</text>
    <text x="580" y="546" class="why">7 / 90 days, and who has known fraud?"</text>
    <text x="580" y="563" class="why">are path patterns here, self-joins over</text>
    <text x="580" y="580" class="why">millions of rows in a table. Only labels</text>
    <text x="580" y="597" class="why">available before the payment count.</text>
  </g>

  <!-- Qdrant -->
  <g>
    <path d="M1000,340 a150,20 0 0,0 300,0 v270 a150,20 0 0,1 -300,0 z" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <ellipse cx="1150" cy="340" rx="150" ry="20" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="1150" y="345" text-anchor="middle" class="h">Qdrant  (task 4)</text>
    <text x="1150" y="378" text-anchor="middle" class="s">collection sentinel_docs, cosine</text>
    <text x="1020" y="408" class="t" font-weight="600">Stores</text>
    <text x="1020" y="428" class="why">• 325 chunks (600 chars) of 223 cleaned</text>
    <text x="1020" y="445" class="why">   train documents: RBI/NPCI exercises,</text>
    <text x="1020" y="462" class="why">   playbooks, guides, case notes</text>
    <text x="1020" y="479" class="why">• 3072-dim vector + payload (document,</text>
    <text x="1020" y="496" class="why">   type, topic, chunk number, text)</text>
    <text x="1020" y="526" class="t" font-weight="600">Why</text>
    <text x="1020" y="546" class="why">Policy is found by meaning, not keyword</text>
    <text x="1020" y="563" class="why">("is a city mismatch enough to block?").</text>
    <text x="1020" y="580" class="why">Nearest-neighbour search and the payload</text>
    <text x="1020" y="597" class="why">filter (policy types only) in one call.</text>
  </g>

  <!-- Euron -->
  <rect x="1090" y="704" width="380" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1106" y="728" class="h">Euron EURI gateway (no storage)</text>
  <text x="1106" y="754" class="why">• Gemini Embedding 2: question → 3072-dim vector</text>
  <text x="1106" y="776" class="why">• gpt-4.1-mini, temperature 0, JSON output:</text>
  <text x="1106" y="794" class="why">   turns the facts into an explanation and maps</text>
  <text x="1106" y="812" class="why">   each signal to its policy chunk. Never sees labels.</text>

  <!-- offline load -->
  <rect x="40" y="704" width="1010" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="56" y="728" class="h">Offline load (run once, safe to rerun)</text>
  <rect x="60" y="746" width="190" height="60" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="155" y="772" text-anchor="middle" class="t">SENTINEL tables</text>
  <text x="155" y="791" text-anchor="middle" class="lbl">csv.gz, folder or zip</text>
  <text x="300" y="760" class="s">load_mongo.py      upserts by _id</text>
  <text x="300" y="782" class="s">load_neo4j.py       MERGE + uniqueness constraints</text>
  <text x="300" y="804" class="s">build_policy_index.py   task 4 cleaning, chunks, embeddings</text>
  <line x1="202" y1="704" x2="202" y2="634" class="dash" marker-end="url(#g)"/>
  <line x1="702" y1="704" x2="702" y2="634" class="dash" marker-end="url(#g)"/>
  <line x1="1030" y1="704" x2="1080" y2="634" class="dash" marker-end="url(#g)"/>

  <!-- footer -->
  <text x="40" y="872" class="t" font-weight="600">Never sent to the LLM: the fraud label.</text>
  <text x="40" y="894" class="s">Labels exist only 60 days after a payment. The API never reads the labels collection, and in the graph a label counts only if label_available_at is before the payment.</text>
  <text x="40" y="922" class="t" font-weight="600">Test results:</text>
  <text x="140" y="922" class="s">10 of 10 answers valid JSON with citations, 0 hallucinated codes or chunks; retrieval hit@5 = 100% (policy documents), 70% (whole collection).</text>
</svg>
